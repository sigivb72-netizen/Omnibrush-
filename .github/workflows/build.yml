name: Build APK

on:
  push:
    paths-ignore:
      - "data/pending.json"
      - "data/news.json"
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scraper tests
        run: |
          if [ -d scraper/tests ]; then
            pip install -r scraper/requirements.txt pytest
            python -m pytest scraper/tests -q
          fi

      - name: Validate data files
        run: |
          if [ -f scraper/validate.py ]; then python scraper/validate.py; fi

      - name: Build APK
        run: >
          ./gradlew --no-daemon assembleRelease
          -PdataRepo=${{ github.repository }}
          -PdataBranch=${{ github.head_ref || github.ref_name }}
          -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MyGachaList-${{ github.run_number }}.apk

      # Uploaded before the tests run, so an APK is available even when a test fails.
      - uses: actions/upload-artifact@v4
        with:
          name: MyGachaList-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Unit tests and app walkthrough
        run: >
          ./gradlew --no-daemon testDebugUnitTest
          -PdataRepo=${{ github.repository }}
          -PdataBranch=${{ github.head_ref || github.ref_name }}
          -PbuildNumber=${{ github.run_number }}

      - name: Upload walkthrough screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

  # Installs the real, optimised APK on an Android emulator and taps through it.
  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MyGachaList-apk
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk through the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/device_smoke.py "$(ls out/*.apk | head -1)" device-screenshots

      - name: Upload device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-screenshots
          path: device-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
