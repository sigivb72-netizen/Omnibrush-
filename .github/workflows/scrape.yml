name: Scrape game news

# Scheduled workflows only run from the repository's default branch.
on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, off the hour to avoid the busiest minute
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Validate data files
        run: python scraper/validate.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/news.json data/pending.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update scraped data"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            # Someone edited the repo meanwhile (e.g. a fix made in the mobile app): replay on top of it.
            git pull --rebase || { git rebase --abort; exit 1; }
          done
          exit 1
