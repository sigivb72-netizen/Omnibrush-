name: iOS

# Compiles the iPad receiver on a GitHub-hosted Mac and packages an unsigned .ipa.
# The .ipa must be signed before an iPad will run it; see docs/IPAD_WITHOUT_A_MAC.md.
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project OmniMirror.xcodeproj -scheme OmniMirror -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "(error|warning: unre)" build.log | sort -u | head -80; tail -30 build.log; exit 1; }
          grep -E "warning:" build.log | grep -v "appintents" | sort -u | head -40 || true
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/OmniMirror.app Payload/
          zip -qry OmniMirror-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OmniMirror-ios-unsigned
          path: ios/OmniMirror-unsigned.ipa
          if-no-files-found: error
