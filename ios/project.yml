# Xcode project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# The .xcodeproj is generated from this file (`xcodegen generate`), so it is not committed.
name: OmniMirror
options:
  bundleIdPrefix: dev.omnimirror
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  OmniMirror:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - OmniMirror
    info:
      path: OmniMirror/Info.plist
      properties:
        CFBundleDisplayName: OmniMirror
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: OmniMirror finds your Android phone on the local network and receives its screen.
        NSBonjourServices:
          - _omnimirror._tcp
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.omnimirror.receiver
        PRODUCT_NAME: OmniMirror
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: false
