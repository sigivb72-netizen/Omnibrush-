<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OmniMirror">
<meta name="theme-color" content="#000000">
<title>OmniMirror</title>
<style>
  :root { --bg:#000; --panel:#111316; --line:#262a30; --text:#e8eaed; --dim:#8b9199; --accent:#4c8dff; --ok:#3ecf8e; --warn:#f5b041; --bad:#ff5c5c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
  #stage { position:fixed; inset:0; background:#000; }
  #stage canvas, #stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:none; background:#000; }
  #panel { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--bg); }
  #card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px 24px; }
  h1 { font-size:20px; margin:0 0 4px; font-weight:600; }
  .sub { color:var(--dim); margin:0 0 22px; }
  label { display:block; color:var(--dim); font-size:13px; margin:0 0 6px; }
  input, select, button { font:inherit; color:var(--text); border-radius:10px; border:1px solid var(--line); background:#0a0b0d; }
  input { width:100%; padding:12px 14px; font-size:24px; letter-spacing:.3em; text-align:center; font-variant-numeric:tabular-nums; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  select { width:100%; padding:10px 12px; }
  button { cursor:pointer; padding:12px 14px; }
  button.primary { width:100%; margin-top:14px; background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.primary:disabled { opacity:.5; }
  #message { min-height:20px; margin-top:12px; font-size:13px; color:var(--dim); }
  #message.bad { color:var(--bad); }
  details { margin-top:18px; color:var(--dim); font-size:13px; }
  details summary { cursor:pointer; }
  details p { margin:8px 0; }
  a { color:var(--accent); }
  #hud { position:fixed; left:max(10px, env(safe-area-inset-left)); top:max(10px, env(safe-area-inset-top)); right:max(10px, env(safe-area-inset-right));
    display:none; align-items:center; gap:8px; pointer-events:none; transition:opacity .2s; }
  #hud.hidden { opacity:0; }
  #hud.hidden * { pointer-events:none !important; }
  #info { pointer-events:none; background:rgba(12,13,15,.78); border:1px solid rgba(255,255,255,.08); border-radius:10px;
    padding:6px 10px; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--warn); margin-right:6px; }
  #dot.ok { background:var(--ok); } #dot.bad { background:var(--bad); }
  #hud .spacer { flex:1; }
  #hud button { pointer-events:auto; background:rgba(12,13,15,.78); border-color:rgba(255,255,255,.08); padding:6px 12px; font-size:12px; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas"></canvas><video id="video" muted playsinline webkit-playsinline disableremoteplayback></video></div>

<div id="hud">
  <div id="info"><span id="dot"></span><span id="infoText">Connecting…</span></div>
  <div class="spacer"></div>
  <button id="fullscreenBtn" type="button">Fullscreen</button>
  <button id="disconnectBtn" type="button">Disconnect</button>
</div>

<div id="panel">
  <form id="card" autocomplete="off">
    <h1>OmniMirror</h1>
    <p class="sub" id="subtitle">Enter the code shown on your phone.</p>
    <label for="pin">Connection code</label>
    <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autofocus>
    <button class="primary" id="connectBtn" type="submit">Connect</button>
    <div id="message"></div>
    <details>
      <summary>Options</summary>
      <p><label for="mode">Decoder</label>
        <select id="mode">
          <option value="auto">Automatic</option>
          <option value="webcodecs">WebCodecs (lowest latency, needs HTTPS)</option>
          <option value="mse">Media Source (works over plain HTTP)</option>
        </select></p>
      <p id="secureHint"></p>
      <p>Tip: use Share → Add to Home Screen to open the mirror fullscreen like an app.</p>
    </details>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
